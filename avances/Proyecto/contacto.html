<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Contacto - Pokémon</title>

        <link rel="icon" href="PokeLogo.png" />
        <link href="bootstrap-5.3.8-examples/assets/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="font-awesome-4.7.0/css/font-awesome.min.css" />
        <link href="https://fonts.cdnfonts.com/css/pokemon-solid" rel="stylesheet" />
        <link rel="stylesheet" href="cover.css" />

        <style>
            .pokemon-font {
                font-family: "Pokemon Solid", sans-serif;
                color: #ffcb05;
                text-shadow:
                    -1px -1px 0 #3b4cca,
                    1px -1px 0 #3b4cca,
                    -1px 1px 0 #3b4cca,
                    1px 1px 0 #3b4cca;
                letter-spacing: 2px;
            }

            .ficha-contacto {
                max-width: 900px;
                margin: 3rem auto;
                background-color: rgba(0, 0, 0, 0.75);
                border: 4px solid #ffcb05;
                border-radius: 20px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            }

            .col-gif {
                background-image: url("IMG/PokePrincipal.gif");
                background-size: cover;
                background-position: center;
                min-height: 400px;
            }

            .card-body-pokemon {
                padding: 40px;
                color: white;
            }

            .form-label {
                font-family: Arial, sans-serif;
                font-weight: bold;
                color: #ffcb05;
                margin-bottom: 5px;
            }

            .form-control {
                border-radius: 8px;
                border: 2px solid #3b4cca;
                background-color: rgba(255, 255, 255, 0.9);
            }

            .btn-pokemon-envio {
                background-color: #ffcb05;
                color: #3b4cca;
                font-family: "Pokemon Solid", sans-serif;
                border: 3px solid #3b4cca;
                padding: 12px;
                width: 100%;
                margin-top: 15px;
                transition: 0.3s;
            }

            .btn-pokemon-envio:hover {
                background-color: #3b4cca;
                color: #ffcb05;
                transform: scale(1.02);
            }

            .redes-ficha i {
                color: #ffcb05;
                font-size: 1.4rem;
                margin: 0 10px;
                transition: 0.3s;
            }

            .redes-ficha i:hover {
                color: white;
            }
        </style>
    </head>

    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
            <div class="container">
                <a class="navbar-brand pokemon-font" href="index.html">Pokémon</a>
                <div class="collapse navbar-collapse justify-content-end">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="contenido/index.html">Contenido</a></li>
                        <li class="nav-item"><a class="nav-link" href="referencias.html">Referencias</a></li>
                        <li class="nav-item">
                            <a
                                class="nav-link active"
                                href="contacto.html"
                                style="border: 1px solid #ffcb05; border-radius: 5px"
                                >Contacto</a
                            >
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container">
            <div class="ficha-contacto">
                <div class="row g-0">
                    <div class="col-md-5 d-none d-md-block col-gif"></div>

                    <div class="col-md-7">
                        <div class="card-body-pokemon">
                            <h2 class="pokemon-font mb-4 text-center" style="font-size: 2.2rem">¡Contáctanos!</h2>

                            <form>
                                <div class="mb-3">
                                    <label class="form-label">Nombre del Entrenador</label>
                                    <input type="text" class="form-control" placeholder="Tu nombre..." />
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Correo Electrónico</label>
                                    <input type="email" class="form-control" placeholder="pkmn@entrenador.com" />
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Mensaje para Bill</label>
                                    <textarea
                                        class="form-control"
                                        rows="4"
                                        placeholder="¿Qué pokémon quieres transferir?"></textarea>
                                </div>

                                <button type="submit" class="btn btn-pokemon-envio">Enviar a la PC de Bill</button>
                            </form>

                            <div class="redes-ficha mt-4 text-center">
                                <i class="fa fa-facebook"></i>
                                <i class="fa fa-instagram"></i>
                                <i class="fa fa-twitter"></i>
                                <i class="fa fa-youtube"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="bootstrap-5.3.8-examples/assets/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
